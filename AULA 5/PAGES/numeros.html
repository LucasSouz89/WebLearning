<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Numeros/range/tel</legend>
            <p>
                <label for="numero">Número</label>
                <input type="number" name="numero" id="numero" min="10" max="20" step="5">
            </p>
            <p>
                <label for="">Velocidade</label>
                <input type="range" name="barra" id="" min="10"  max="100" step="10">
            </p>
            <p>
                <label for="">Telefone</label>
                <input type="tel" required placeholder="(xx) xxxxx-xxxx">
            </p>
        </fieldset>
    </form>
</body>
</html>
