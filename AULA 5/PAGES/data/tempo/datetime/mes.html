<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="dados" id="dados" method="post" action="">
<fieldset>
        <legend>Dia de lançamento</legend>
        <p>
            <label for="date">Data do lançamento</label>
            <input type="date" name="data" id="date" required>
        </p>

        <p>
            <label for="hora">Hora atual</label>
            <input type="time" name="hora" id="hora" required>
        </p>
        <p>
            <label for="horalocal">Hora local</label>
            <input type="datetime-local" name="horalocal" id="hora local">
        </p>
        <p>
           <label for="Semana">Semana</label> 
           <input type="week" required id="Semana" name="Semana">
        </p>
        <p>
            <label for="mes">Mês</label>
            <input type="month" required id="mes" name="mes">
        </p>
    </fieldset>
    </form>
</body>
</html>
